{% extends 'shoes/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}
<h2>{{ heading }}</h2>
{% endblock page_header %}

{% block content %}
<form method="post" enctype="mutlipart/form-data">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save" %}
    <a href="{% url 'shoes:my_shoes' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock content %}
